name: Publish Java Package

on:
    release:
        types: [published]

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: "25"
                  distribution: "temurin"
                  server-id: github-pkg
                  settings-path: ${{ github.workspace }}

            - name: Write Maven settings
              run: |
                  cat > ${{ github.workspace }}/settings.xml << 'EOF'
                  <settings>
                    <servers>
                      <server>
                        <id>github-pkg</id>
                        <username>${env.GITHUB_ACTOR}</username>
                        <password>${env.GITHUB_TOKEN}</password>
                      </server>
                    </servers>
                  </settings>
                  EOF

            - name: Publish package with Maven
              run: mvn --batch-mode deploy --settings ${{ github.workspace }}/settings.xml
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
